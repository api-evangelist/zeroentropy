aid: zeroentropy
name: ZeroEntropy
description: >-
  ZeroEntropy builds specialized, lightweight AI models for information retrieval
  and retrieval-augmented generation (RAG). Its zerank rerankers and zembed embedding
  models improve the accuracy of any search pipeline, and its hosted retrieval API
  lets developers create collections, index documents, and run relevance queries
  (top documents, pages, and snippets) with metadata filtering. The API is a versioned
  (/v1) HTTP JSON service with US and EU data-center endpoints, official Python and
  TypeScript SDKs, and API-key bearer authentication. ZeroEntropy is a portfolio
  company of Initialized Capital operating in the enterprise AI / search sector.
